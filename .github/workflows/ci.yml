name: ci

# The fork's only workflow. Upstream's workflows were removed: they target
# runners (blacksmith-*), secrets (AI_GATEWAY_API_KEY, npm publishing) and
# devices this repository does not have.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build and typecheck
        run: pnpm typecheck

      - name: Unit tests (e2e)
        run: pnpm --filter e2e run test:unit

      - name: Script tests
        run: pnpm run test:scripts
